# Example ATOMIX Meta file. Note the use of anchors via & to avoid repeating information

# Here we add global metadata you may want
#Global:
                       
title: ATOMIX tidal channel example for an acoustic-Doppler Nortek Signature 1000
platform_type: Bottom-mounted on a lander  
#date_created: appended automatically during file creation
#disclaimer: also appended automatically
comment: Tidal Channel, Menai Strait, Anglesey, Wales 
conventions: CF-1.6, ATOMIX
abstract: Data collected in a tidal channel known as the Menai Straits, a ~25 km long stretch of shallow tidal water separating Anglesey from mainland Wales, UK, with width at the study site of~500m. This un-stratified tidal channel, with flood direction NE to SW, has a highly energetic modified semi-diurnal tide with maximum spring tide range of ~6 m and depth-mean streamwise tidal velocities in the main channel reaching 2.5 m/s. The ADCP location is sheltered by buildings and topography, thus the risk of contamination of observations by surface waves is greatly reduced. For more information the reader is directed to this work: https://doi.org/10.1016/j.renene.2022.05.044

