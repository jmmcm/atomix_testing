## ================ Level 1 =================

L1:  # Level 1: Raw instrument data
   R_VEL_FLAGS:
        standard_name: status_flag
        flag_masks: 
           - 1
           - 2 
           - 4
           - 8
           - 16
           - 32
           - 64
           - 128
  
        flag_meanings: |
           valid_bin_low
           valid_bin_high 
           out_of_range_low
           out_of_range_high
           low_correlation
           low_amplitude
           excessive_tilt
           fish_rejection
           
        comment:  Flags denote the cause for excluding individual velocity samples recorded by the instrument from subsequent analysis. # Add extra entries, which will appear as attributes in the netcdf
        
        flag_thresholds:
           - -999 # first valid bin
           - -999 # last valid bin
           - -0.03 # lowest velocity considered valid 
           - 0.03 # highest velocity considered valid
           - 65 # CORR minimum threshold (RDI WC)
           - -999 # ABSIC minimum threshold
           - 20 # maximum absolute PITCH or ROLL
           - 50 # ABSIC threshold used in fish rejection algorithm (RDI WA)
      
        flag_threshold_meanings: |
           exclude_bins_below_threshold
           exclude_bins_above_threshold
           exclude_values_below_threshold
           exclude_values_above_threshold
           exclude_values_if_CORR_below_threshold
           exclude_values_if_ABSIC_below_threshold
           exclude_values_if_any_tilt_angle_above_threshold
           ABSIC_threshold_for_fish_rejection_algorithm

 ## ================Level 2 segmented =================
L2: # No additional flags. Level 1 flags should be used to identify bad data. This section is included as a placeholder
    R_VEL_DETRENDED_FLAGS:
        standard_name: status_flag
        flag_masks: 
           - 1

        flag_meanings: |
           unknown
        
        comment: No flags currently defined for this level
   
        flag_thresholds:
           - -999 # 
       
      
        flag_threshold_meanings: |
           unused

## ================Level 3 =================
L3:
   DLL_FLAGS: &dll_boolean 
        standard_name: status_flag
        flag_masks: 
           - 1
           - 2
           - 4
           - 8
        flag_meanings: |
            unknown 
            insufficient_number_velocity_samples
            too_close_to_range_limits
            non_existent_bin_pair
        comment: These flags identify why segments were discarded for fitting the structure function to the DLL observations with respect to deltaR variable

        # Add extra entries, which will appear as attributes in the netcdf
        flag_thresholds:  
            - -999999 # Flag will be applied if value is a Nan for unknown reason
            - 0.5 # ratio of good points in segment (i.e. reject Dll segments if more than 50% of the data is missing or unreliable)
            - 0 # Minimum number of bins from first range bin or last range bin 
            - 0 # Value will be excluded if upper or lower bin is a Nan (i.e. bin combination not possible)
        flag_threshold_meanings: |
            not_applicable
            excluded_if_ratio_below_threshold
            excluded_if_value_below_threshold
            excluded_if_nan
  
   TIME: &time
        bounds: TIME_BNDS
   TIME_BNDS: &time_bnds  
        comment: Beginning and end of each time interval specified by the TIME variable
  
## ================Level 4 =================
L4:
   EPSI_FLAGS: &epsi_boolean
        standard_name: status_flag
        flag_masks: 
           - 1
           - 2
           - 4
           - 8
           - 16
           - 32
           - 64
           - 128

        flag_meanings: |
           unknown
           Rsquared_too_low
           delta_epsi_too_large
           A3_coeff_invalid
           dll_intercept_too_low
           dll_intercept_too_high
           regression_poorly_conditioned
           dll_slope_out_of_range
           
        comment: Flags denote the reason for excluding individual EPSI values from the calculation of EPSI_FINAL

        flag_thresholds: 
            - -999999 # Flag will be applied if value is a Nan for unknown reason
            - 0.2 # Flag values where R2 is lower than this
            - 999 # Flag values where deltaEps/Eps > value
            - 0 # Flag values where a3 < value
            - 0 # [m^(2) s^(-2)] Flag values where intercept < threshold
            - 7.0e-5 # [m^(2) s^(-2)] Flag values where intercept > threshold (threshhold = 2*yint_expected = 2*(2*sigma_v^2), where sigma_v is expected accuracy in along-beam vel. sigma_v estimated from noise floor of the spectra (updated Feb 4, 2025)
            - 3 # Flag values where there are fewer than this number of points for the regression
            - 0 # [m^(4/3)s^(-2)] Flag values where slope < threshold (would lead to negative epsilon)
            
            

        flag_threshold_meanings: |
            not_applicable
            excluded_if_value_below_threshold
            excluded_if_ratio_above_threshold
            excluded_if_value_below_threshold
            excluded_if_value_below_threshold
            excluded_if_value_above_threshold
            excluded_if_value_below_threshold
            excluded_if_value_below_threshold

   TIME: *time
   TIME_BNDS: *time_bnds 
   EPSI_FINAL:
        cell_methods: N_BEAM:mean

