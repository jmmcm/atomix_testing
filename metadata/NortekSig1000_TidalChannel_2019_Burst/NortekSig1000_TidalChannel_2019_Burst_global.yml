#time_deployment_end: # 

# Who recorded ===================
institution:   Bangor University
project_name: unknown
cruise:  unknown # Catchy name of cruise
vessel: unknown # IMO vessel number    
creator_name: Dr Natasha Lucas # Name of person or institution who created this file.
references:  # enter Journal doi, etc.
acknowledgements: Velocity data to be used for testing epsilon algorithm #Enter how ppl can use the data
#keywords: 
source: subsurface lander  #Use a term from the SeaVoX Platform Categories vocabulary (L06) list, usually one of the following:  subsurface mooring, ship, sub-surface gliders, autonomous underwater vehicle ()

# Instrument specific info for turbulence data ================
instrument: Nortek Signature1000 ADCP # RDI Teledyne ADCP, 1600 KHz Monitor.
#\instrument_serial_number: 100460
instrument_nominal_depth: 13 # numeric value in m
instrument_nominal_height: 0.3 #TODO: Update
# instrument_sample_interval: # in seconds
instrument_sample_rate: 8 # in Hz (supply only 1)
instrument_sampling_mode: continuous # Natasha said it was burst but data looks to be continuous

instrument_nominal_orientation: up # check ATOMIX spreadsheer=================
instrument_burst_interval: inf# s
instrument_burst_duration: inf #    
instrument_program_comment: The signature was set in burst mode to allow for velocity measurements from all 5-beams (tracking/altimeter was turned off). Burst interval and duration match with the intent of measuring as continuously as possible.  
instrument_beam2xyz_transformation_matrix: "1.1831     0       -1.1831 0;  0      -1.1831     0 1.1831; .5518 0 0.5518 0;  0 .5518 0 0.5518"
instrument_measured_coordinate_system: BEAM
instrument_nominal_velocity_range: 1m/s # TODO:Check
#ancillary_sensors: none #Very brief text detailing additional non-turbulence sensors here, and how they've been processed.

