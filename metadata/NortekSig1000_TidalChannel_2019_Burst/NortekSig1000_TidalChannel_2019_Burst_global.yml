# Example ATOMIX Meta file. Note the use of anchors via & to avoid repeating information

# Here we add global metadata you may want
#Global:
                       
title: ATOMIX tidal channel example for an acoustic-Doppler Nortek Signature
platform_type: Bottom-mounted on a lander  #TODO:Check
#date_created: appended automatically during file creation
#disclaimer: also appended automatically
comment: Tidal Channel in Wales #TODO:Check
conventions: CF-1.6, ATOMIX
abstract: Data collected in tidal channel.  #Optional long abstract of project etc...

#Location specific
# area: Ocean, near shore?
geospatial_lat_min: -13.7681 #TODO: Update 
geospatial_lat_max: -13.7681 #TODO: Update
geospatial_lon_min: 123.3539 #TODO: Update
geospatial_lon_max: 123.3539 #TODO: Update
#geospatial_vertical_min: 181.7
#geospatial_vertical_max: 182.95
geospatial_vertical_positive: up
time_coverage_start: '2019-07-09T09:13:40Z' #yyyy-mm-ddTHH:MM:SSZ
time_coverage_end: '2019-09-10T05:05:21Z'
