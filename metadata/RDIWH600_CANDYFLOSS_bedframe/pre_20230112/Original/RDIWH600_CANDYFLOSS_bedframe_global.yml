instrument_program_comment: Mode 12 high ping rate with 2 code reps (sub-pings) averaged as a single ping.  40 bins, size 50 cm, bin 1 centred at 1.91 m above transducer.  Ambiguity velocity set at 80 cm/s (WV80)
