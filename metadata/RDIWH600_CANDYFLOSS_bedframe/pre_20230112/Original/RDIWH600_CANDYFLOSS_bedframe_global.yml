# Gobal metadata for ATOMIX sample data from Candyfloss - bedframe instrument, unstratified winter conditions

title: sample CANDYFLOSS turbulence mooring ADCP data - bedframe, unstratified, large surface waves
platform_type: ADCP gimbal-mounted upward-looking on a bedframe 
#date_created: appended automatically during file creation
#disclaimer: also appended automatically
comment: Candyfloss is part of the UK NERC / DEFRA funded Shelf Sea Biogeochemistry project
conventions: CF-1.6, ATOMIX
abstract: Bedframe containing the gimbal-mounted ADCP configured to make turbulent velocity observations for structure function estimates of the TKE dissipation rate in the bottom boundary layer at a Central Celtic Sea site.  Part of a programme between April 2014 and July 2015 with five sucessive deployments and multiple moorings providing concurrent observations of water column velocity, near-bed turbulent velocity, water column temperature and salinity, meteorology and waves. Fourth bedframe deployment on 21/11/2014 with turbulence ADCP configured to start collecting data on 1/1/2015.  Recovery attempt in April 2015 failed, bedframe eventually recovered in August 2015.  Data logging stopped on 2/6/2015 when memory full.

