#===================================================================================
#       GROUP LEVEL SPECIFIC METADATA #
#===================================================================================     
        
Ancillary:
  dimensions:
        - TIME
        - Z_DIST
        - N_BEAM
        
  ENU: Segment mean earth coordinate velocity (East, North, Up) by depth
  
# ================ L1 =================

L1: # Level 1: Raw instrument data
   dimensions:  
        - TIME
        - N_BEAM
        - Z_DIST
    
   processing_level:  Raw along-beam velocity data from the ADCP together with quality control flags and ancillary measurements.  # Add more information to suit
   
   burst_mode: true
   burst_length: 1024
   
   time_ref: 2017-01-01T00:00:00Z #yyyy-mm-ddTHH:MM:SSZ

# ================ L2 =================

L2:  # Level 2: Segmented data
   dimensions:  
        - N_SEGMENT
        - N_SAMPLE
        - Z_DIST 
        - N_BEAM
        
   processing_level:  L1 R_VEL with all L1 R_VEL_FLAGS qaqc flags applied have been split into segments of standard length and detrended.
   
   segment_length: 1024 # number of profiles per segment
   segment_overlap_proportion: 0 # fraction of segment overlapping in successive segments 
   
   # detrending_method: R_VEL_DETRENDED calculated with no detrending applied as velocity difference between bins due to linear shear is resolved by the modified structure function regression.
   detrending_method: R_VEL_DETRENDED calculated by deducting the segment mean evaluated for each beam / bin / burst.
   # detrending_method: R_VEL_DETRENDED calculated by deducting the segment mean and linear trend evaluated for each beam / bin / burst.
   
# ================ L3_M1 =================

L3: # Level 3: Dll 
   dimensions:  
        - TIME
        - Z_DIST
        - N_DEL
        - N_BEAM
   
   processing_level: L2 R_VEL_DETRENDED data with L2 R_VEL_DETRENDED_FLAGS qaqc flags applied has been used to calculate the second-order longitudinal structure function DLL. 
   
   dll_method:  Central-difference scheme as per Wiles et al. (2006).
   # dll_method: Forward-difference scheme as per McMillan et al. ( ).
   
      
# ================ L4_M1A =================

L4: # Level 4: Dissipation 
   dimensions:  
        - TIME
        - Z_DIST 
        - N_BEAM
        #- N_R_MAX
      
   processing_level: L3_M1 DLL values with L3_M1 DLL_FLAGS qaqc flags applied have been used to produce estimates of TKE dissipation rate (epsilon) for each beam and bin.
      
   # regression_model: Regression of DLL against r^(2/3) using standard model y ~ x1 as per Wiles et al. (2006).
   regression_model: Regression of DLL against r^(2/3) and r^2 using modified model y ~ x1 + x1:x1:x1 as per Scannell et al. (2017).
   
   regression_method: Least-squares including all evaluated separation distances to r_max. 
  
   r_max_req: 1.0 # maximum separation distance over which the regression is evaluated (m)
   
   C2: 2.0 # empirical constant used in the epsilon calculation

   EPSI_FINAL_method: L4_M1A EPSI with values set to NaN where L4_M1A EPSI_FLAGS is not 0.
   


   