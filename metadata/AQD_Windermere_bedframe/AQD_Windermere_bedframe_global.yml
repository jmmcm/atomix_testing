comment: Windermere bedframe Aquadopp
conventions: CF-1.6, ATOMIX
abstract: Data collected as part of a study of the annual cycle of energy input and the impact of stratification in a temperate lake.  Observations included meteorological data, water column temperature structure and velocity measurements, as well as ADCP configured to provide velocity data for structure function estimates of turbulent kinetic energy dissipation rate, epsilon in the bottom boundary layer and the region of the thermocline.  Observations were made over the period October 2016 to December 2017, split over five deployments with instruments typically recovered and redeployed on successive days.  Sample data comes from deployment period 4, which ran from 11th July to 16th October 2017.

