# Example ATOMIX Meta file. Note the use of anchors via & to avoid repeating information

# Here we add global metadata you may want
#Global:
                       
title: ATOMIX tidal example for an acoustic-Doppler Nortek Signature
platform_type: Bottom-mounted on a lander 
#date_created: appended automatically during file creation
#disclaimer: also appended automatically
comment: Tidally-forced dataset from Northwest shelf  of Australia
conventions: CF-1.6, ATOMIX
abstract: Lander deployed to investigate sediment suspension in a region of internal wave activity.  Several other moorings were deployed concurrently in the region during this field experiment.  #Optional long abstract of project etc...

#Location specific
# area: Ocean, near shore?
geospatial_lat_min: -13.7681 #degrees.decimal negative for S hemispher
geospatial_lat_max: -13.7681
geospatial_lon_min: 123.3539
geospatial_lon_max: 123.3539
#geospatial_vertical_min: 181.7
#geospatial_vertical_max: 182.95
geospatial_vertical_positive: down
time_coverage_start: '2017-04-03T06:05:00Z' #yyyy-mm-ddTHH:MM:SSZ
time_coverage_end: '2017-04-03T10:15:00Z'
#time_deployment_start: # useful for moorings since data will be recorded while instruments on deck (coverage start is sometimes much before deployment start/end)
#time_deployment_end: # 

# Who recorded ===================
institution:   University of Western Australia
#authors: #Person A and Person B
project_name: Offshore hub
cruise:  KISSME # Catchy name of cruise
vessel: RV Solander # IMO vessel number    
creator_name: Dr Cynthia Bluteau # Name of person or institution who created this file.
# creator_email:  cynthia_bluteau@uqar.ca  
references:  # enter Journal doi, etc.
acknowledgements: Variable quality velocity data to be used for testing epsilon algorithm #Enter how ppl can use the data
#keywords: 
source: subsurface lander  #"Use a term from the SeaVoX Platform Categories vocabulary (L06) list, usually one of the following:  subsurface mooring, ship, sub-surface gliders, autonomous underwater vehicle ()

# Instrument specific info for turbulence data ================
instrument: Nortek Signature1000 ADCP # RDI Teledyne ADCP, 1600 KHz Monitor.
#\instrument_serial_number: 100460
instrument_nominal_depth: 253 # numeric value in m
instrument_nominal_height: 0.3
# instrument_sample_interval: # in seconds
instrument_sample_rate: 8 # in Hz (supply only 1)
instrument_sampling_mode: continuous # comment about bursting mode or continuous

instrument_nominal_orientation: up # check ATOMIX spreadsheer=================
instrument_burst_interval: 14400 s# s
instrument_burst_duration: 14400 s #    
instrument_program_comment: The signature was set in burst mode to allow for velocity measurements from all 5-beams (tracking/altimeter was turned off). Burst interval and duration match with the intent of measuring as continuously as possible. Did not use high-resolution mode given the target depth range of ~20m.  
instrument_beam2xyz_transformation_matrix: "1.1831     0       -1.1831 0;  0      -1.1831     0 1.1831; .5518 0 0.5518 0;  0 .5518 0 0.5518"
instrument_measured_coordinate_system: BEAM
instrument_nominal_velocity_range: 1m/s
#ancillary_sensors: A 1200 kHz acoustic- Doppler current profiler (RDI, Teledyne) measured velocities (mode 12) at 1Hz from ~1 to 13 m above bed. A string of thermistors was also attached to the lander, with seabird thermistors at ~0.5m vertical resolution. The pressure records shown are those from the Vector 6019 located 1-m below 6329. 
#Very brief text detailing additional non-turbulence sensors here, and how they've been processed.

