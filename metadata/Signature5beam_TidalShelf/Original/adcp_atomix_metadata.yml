# Example ATOMIX Meta file. Note the use of anchors via & to avoid repeating information

   
#===================================================================================
#      NETCDF GROUP SPECIFIC METADATA #
#===================================================================================     
        
L1: #atomix_level  
   dimensions:  &dim_timeseries  # the & creates an alias dim_timeseries to reuse this info later
        - TIME
        - Z_DIST
        - N_BEAM
        

    
   processing_level:  This group includes the raw measurements from the recorder, and ancillary measurements required for quality-controlling them using the manufacturer's recommendations. # Add more information to suit
     

#==========================

L2: #Level2_segmented: 
   dimensions:  
        - TIME #N_SEGMENT
        - Z_DIST 
        - N_BEAM
        - N_SAMPLE
        
        
        
   processing_level:  In this group, QAQCd velocities have been split into smaller segments for processing. Detrending may occur at this step if this wasn't completed at the previous processing level. 
   
   detrending_method: #Name of technique and citation. 
   
   segment_length:  # Provide length in seconds. typically 400-800s (5-10 min). The number of samples is already a variable so no need to rewrite it here. This may be the same or different to the burst_length
   
   segment_overlap_proportion: 0.5 # 0.5 for 50%.
   
   
#==========================
L3: 
   dimensions:  
        - TIME
        - Z_DIST
        - N_BEAM
        - N_DEL
   
   processing_level: This group includes the structure function Dll as a function of the separation distance.  Any ancillary information required for estimatng the dissipation of turbulent kinetic energy may also be stored here. 
   
   dll_calculation_type: # central, forward, or backward differencing. 
   
   stationarity_testing: # details on which type of stationarity testing done on the segmented velocities. Not sure if this should be reported here or level2a.
   
   noise_testing: # details of testing the noise levels, or if the signal comprises mostly of noise. 


#==========================
#Level4_dissipation: 
#   dimensions:  *dim_timeseries
#   
#   processing_level: This group includes the results associated with fitting the structure function to data in level 3. The results for each beam, along with quality indicators and errors are provided. A final estimate for the turbulent kinetic energy dissipation is also provided. 
#   
#
#   dll_fitting_method: # statistical technique used for fitting the spectra.
#   # Enter more attributes about how certain things (errors) were calculated?
   

