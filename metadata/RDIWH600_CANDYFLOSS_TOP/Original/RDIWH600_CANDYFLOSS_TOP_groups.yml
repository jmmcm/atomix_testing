## ================ L4_A1S =================

L4_A1S: # Mean deducted, DLL using method 1, standard regression model 
   dimensions:  
        - TIME
        - Z_DIST 
        - N_BEAM
      
   processing_level: L3_A1 DLL values with L3_A1 DLL_FLAGS qaqc flags applied have been used to produce estimates of TKE dissipation rate (epsilon) for each beam and bin.
      
   regression_model: Regression of DLL against r^(2/3) using standard model y ~ x1 as per Wiles et al. (2006).
   # regression_model: Regression of DLL against r^(2/3) and r^2 using modified model y ~ x1 + x1:x1:x1 as per Scannell et al. (2017).
   
   regression_method: Least-squares including all evaluated separation distances to r_max. 
     
   r_max_req: 1.5, 1.5, 1.5, 1.5  # maximum separation distance per beam over which the regression is evaluated (single value of value per beam separated by blank space - no brackets or additional characters)
   
   C2: 2.0 # empirical constant used in the epsilon calculation

   EPSI_FINAL_method: arithmetic mean across beams of resolved EPSI after all EPSI_FLAG applied.
   
## ================ L4_A1M =================

L4_A1M: # Mean deducted, DLL using method 1, modified regression model 
   dimensions:  
        - TIME
        - Z_DIST 
        - N_BEAM
       
   processing_level: L3_A1 DLL values with L3_A1 DLL_FLAGS qaqc flags applied have been used to produce estimates of TKE dissipation rate (epsilon) for each beam and bin.
      
   # regression_model: Regression of DLL against r^(2/3) using standard model y ~ x1 as per Wiles et al. (2006).
   regression_model: Regression of DLL against r^(2/3) and r^2 using modified model y ~ x1 + x1:x1:x1 as per Scannell et al. (2017).
   
   regression_method: Least-squares using evaluated separation distances to r_max. 
  
   r_max_req: 1.5, 1.5, 1.5, 1.5  # maximum separation distance over which the regression is evaluated
   
   C2: 2.0 # empirical constant used in the epsilon calculation

   EPSI_FINAL_method: arithmetic mean across beams of resolved EPSI after all EPSI_FLAG applied.
  
