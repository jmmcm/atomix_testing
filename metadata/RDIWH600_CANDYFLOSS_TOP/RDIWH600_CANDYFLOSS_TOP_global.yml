# Instrument specific info for turbulence data ================
instrument: Teledyne RDI ADCP, 600 KHz WorkHorse
instrument_serial_number: 7301
instrument_nominal_depth: -21.8 # numeric value in m
#instrument_nominal_height: 0.3
instrument_nominal_orientation: up
mooring: Buoyancy tensioned, seabed anchor
instrument_mounting: Installed in syntactic buoy, shackled above and below
# instrument_sample_interval: # in seconds
instrument_sample_rate: 1 # in Hz (supply only 1)
instrument_sampling_mode: burst of 300 profiles (5 minutes) followed by 15 minutes sleep
instrument_burst_interval: 900 s #
instrument_burst_duration: 300 s #    
instrument_program_comment: Mode 5 pulse-pulse correlation, single ping per ensemble (no averaging).  High resolution mode ambiguity velocity 10 cm/s and vertical bin size 10 cm.  Expected profiling range 3.5 m and maximum relative velocity 1 m/s with velocity standard deviation of 0.61 cm/s.
