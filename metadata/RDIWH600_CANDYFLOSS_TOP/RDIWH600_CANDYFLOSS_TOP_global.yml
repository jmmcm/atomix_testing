# Gobal metadata for ATOMIX sample data from Candyfloss - upper instrument, unstratified winter conditions

title: sample CANDYFLOSS turbulence mooring ADCP data - upper instrument, unstratified winter conditions
platform_type: ADCP mounted upward-looking in spherical syntactic buoy on buoyancy tensioned mooring 
#date_created: appended automatically during file creation
#disclaimer: also appended automatically
comment: Candyfloss is part of the UK NERC / DEFRA funded Shelf Sea Biogeochemistry project
conventions: CF-1.6, ATOMIX
abstract: Data from the uppermost instrument on a mooring with three ADCP configured to make turbulent velocity observations for structure function estimates of TKE dissipation rate in the upper third of the water column at a Central Celtic Sea site.  Part of a programme between April 2014 and July 2015 with five sucessive deployments and multiple moorings providing concurrent observations of water column velocity, near-bed turbulent velocity, water column temperature and salinity, meteorology and waves.

